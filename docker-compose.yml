services:
  postgres:
    image: postgres:17-alpine
    container_name: web_parfum_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_parfum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_parfum"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./web_parfum_dotnet
      dockerfile: Dockerfile
    container_name: web_parfum_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=web_parfum;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

volumes:
  pgdata:
